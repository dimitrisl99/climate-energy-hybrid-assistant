services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: climate-backend

    ports:
      - "8000:8000"

    environment:
      OLLAMA_HOST: "http://host.docker.internal:11434"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: climate-frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend